name: Publish to NPM

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publisher（OIDC 无 token 发布）需要 npm CLI ≥ 11；Node 22 自带的 10.x 不支持
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run build

      - name: Check if version already published
        run: |
          PKG_NAME=$(node -e "console.log(require('./package.json').name)")
          PKG_VER=$(node -e "console.log(require('./package.json').version)")
          PUBLISHED_VER=$(npm view "${PKG_NAME}" version 2>/dev/null || echo "")
          if [ "${PUBLISHED_VER}" = "${PKG_VER}" ]; then
            echo "Version ${PKG_VER} already published to NPM, skipping publish."
            echo "skip=true" >> $GITHUB_ENV
          else
            echo "Version ${PKG_VER} not yet published (latest: ${PUBLISHED_VER:-none}), proceeding."
          fi

      # 无 NODE_AUTH_TOKEN：走 OIDC Trusted Publisher（npm publish --provenance 自动交换临时凭据）
      - run: npm publish --provenance --access public
        if: env.skip != 'true'
